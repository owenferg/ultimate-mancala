# redeploys the site to Cloudflare Workers whenever main changes
# needs two repo secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: # lets a deploy be run by hand from the actions tab
concurrency:
  group: deploy
  cancel-in-progress: true # only the newest push matters
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4" # the action's default is wrangler 3, which can't read this config
